$def with(course, type, lvl, thing, sendresults)
$var title: $(i18n.misc[type]) ~ $(course['title'])
$var js: /static/js/markdown.min.js, /static/js/preact.min.js, /static/js/learn.js
$var header: 1
$var footer: 1

$ url = course['url'] + str(lvl) if lvl else course['url']

<header class="white">
  <div class="inner">
    <p class="course-title">
      <a href="$(url)"><span class="ico ico-arr-left"></span></a>
      $(course['title'])
      <span id="level-title"></span>
    </p>
  </div>
</header>

<script>
  window.MEMLIKE = window.MEMLIKE || {};
  window.MEMLIKE.course = $:(json(course));
  /*
  ${"$"}_URL = {
    lvl        : $:(lvl if lvl else "'" + ",".join(sorted(course['levels'].keys(), key=int)) + "'"),
    type       : "$(type)",
    urlFrom    : "$(url)",
    thing      : $(thing if thing else 0),
    sendresults : $(sendresults if session["loggedin"] else 0),
    session     : $(1 if session["loggedin"] else 0)
  */
  window.MEMLIKE.garden = {
    levelsIndexes: $:(lvl if lvl else "'" + ",".join(sorted(course['levels'].keys(), key=int)) + "'"),
    sessionType: "$(type)",
    sessionOriginURL: "$(url)",
    previewThing: $(thing if thing else 0),
    saveProgress: $(sendresults if session["loggedin"] else 0),
    sessionIsAnonymous: $(1 if session["loggedin"] else 0),
  };
</script>

<main id="body">
  <div id="learn-container" class="inner"></div>
</main>
