# minimum_pre_commit_version: "4.4.0"
exclude: |
    (?x)^(
        static/img/|
        static/js/|
        src/tests/testset/
    )
fail_fast: false
repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.14.7"
    hooks:
    -   id: ruff-check
        files: ^src/
        args: ["--fix"]
    -   id: ruff-format
-   repo: https://github.com/pre-commit/pygrep-hooks
    rev: v1.10.0
    hooks:
    -   id: python-use-type-annotations
        files: ^src/
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
-   repo: local
    hooks:
    -   id: eslint
        name: eslint
        entry: npx eslint
        language: system
        pass_filenames: true
        files: ^static/js6/
